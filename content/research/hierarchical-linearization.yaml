    caption: A conceptional sketch of hierarchical linearization. Each row represents a layer of hierarchy, and arrows among layers are the flow of information. The block HLi  consists of directional decoupling and autonomization. After the virtual input vi has been designed at the block, the subsystem controlled by vi becomes uncontrollable subspace for lower layer subsystems. At the end, actual inputs are calculated gathering the information of vi.
    jcaption: 階層型線形化の概念図．各行で表されるものが階層を表し，階層間の矢印が情報の流れを表している．各階層のHLi は方向性分離と自律化をおこなうブロックを表す．ここでvi の設計まで完了することでviで制御されるサブシステムは下の階層には不可制御な部分空間になる．最終的な実入力は各階層で設計されたviの情報を吸い上げることで算出される．
