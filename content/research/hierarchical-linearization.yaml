title: Hierarchical linearization
jtitle: 階層型線形化
abst: |-
  This method is one of the natural extension of "input-output linearization". The key idea of the extension is that a designed input can be canceled by another "independent" input. Based on this independence, a hierarchical structure can be defined as shown in Fig. 1. In each layer, subsystems are linearized using ordinary input-output linearization.
  The advantages of this method are following two. Firstly, a degree of linearizable subsystem increases comparing to ordinary input-output linearization. Secondly,  a controller designed via this method is static feedback form as distinct from dynamic feedback.
jabst: |-
  階層型線形化は，設計済みの入力はそれとは独立な入力によって打ち消すことができるというアイデアを使って，入出力線形化という従来の手法を自然な形で拡張した手法になっている．この入力の独立性によって図１に示すような階層構造が定義でき，各階層は入出力線形化手法を用いて線形化される．
  この手法の利点は主に２つ挙げられる．第一に，線形化可能な次数が増加する点．第二に設計される入力が動的なものではなく静的な状態フィードバックになっている点である．
