role: "2: control"
title: Leg configuration control and load distribution control based on model predictive control for Leg/wheeled mobile robots
jtitle: 脚車輪型移動ロボットのモデル予測制御に基づいた荷重配分と脚配置制御
abst: In this study, we propose locomotion control for leg/wheel mobile robot based on model predictive control in the extraterrestrial environment. This robot has legs with redundant degrees of freedom. Using model predictive control, we control these legs based on the prediction of future behavior.
jabst: 本研究では，月面環境下におけるモデル予測制御を用いた脚車輪型移動ロボットの制御を提案する．このロボットは冗長な自由度の脚関節を持っている．モデル予測制御により，対象の挙動予測に基づいた最適な制御を行う．
keywords:
  - Leg-Wheel
  - ATHLETE
  - MPC
  - Trajectory Tracking
