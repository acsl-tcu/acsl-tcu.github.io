    caption: Appearance of target spacecraft. In this figure, the reaction wheel attached on YB axis is broken. H0 represents non-zero total angular momentum. Due to this momentum, attitude control becomes too complicated to operate heulistically.
    jcaption: 対象とする人工衛星の外観図．YB軸のリアクションホイールが故障した場合を表している．H0はシステム全体の角運動量を表しており，この項が存在することによって姿勢制御はとても複雑な問題となってしまう．そのため人間の直感的な方法によってこのような状況の人工衛星を制御することは難しい．
