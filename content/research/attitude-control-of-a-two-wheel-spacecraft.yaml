title: Attitude control of a two-wheel spacecraft
jtitle: ２基のリアクション・ホイールによる衛星の姿勢制御
abst: Target application is underactuated two-wheel spacecraft under non-zero total angular momentum. Attitude control of a spacecraft using two reaction wheels is difficult under the non-zero total angular momentum because the degree of freedom  with respect to attitude is three. Hence, all spacecrafts contain three or more reaction wheels to control their attitude. However, during the long term operation, actuators will be broken as reported Hayabusa (MUSES-C) and space telescope Kepler. To cope with such an accident, we develop attitude control low for two reaction wheels.
jabst: 人口衛星の姿勢制御は姿勢の自由度が３であることから，３基またはそれ以上のリアクションホイールと呼ばれるアクチュエータでおこなわれるのが一般的である．しかし長期運用の中で小惑星探査機「はやぶさ」や宇宙望遠鏡「Kepler」で報告されているように姿勢制御のためのアクチュエータが故障してしまうことがある．我々はこのような場合に対しても姿勢制御を継続できるよう姿勢制御則の開発をおこなっている．
