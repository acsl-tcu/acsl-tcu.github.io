    caption: The simulation result of an acceleration trajectory. The red line is the proposed method. The green line is the conventional method. The orange line is soft constraints. The pink line is hard constraints. The conventional method decelerates asymptotically whereas the proposed method decelerates linearly.
    jcaption: 提案手法による加速度軌道の整形．赤線が提案手法で緑線が比較手法，オレンジ点線はソフト制約，桃点線はハード制約．比較手法が漸近的に減速しているのに対し，提案手法は直線的に整形されている．
