    caption: "System of MEC.First, model based controller input the same signal into the spacecraft model and actual spacecraft. Next, this system feedback differences in output between actual spacecraft and spacecraft model. This system can compensate the excessive input and the lack input that occurred by the model error by using this feedback. "
    jcaption: モデル誤差補償器の構造．実際の衛星とモデルに同一信号を入力し，その出力の差をフィードバックする．これによって，実際の衛星の動きをモデルの動きに寄せることができる
