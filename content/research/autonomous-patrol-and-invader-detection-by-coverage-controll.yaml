figures:
  - path: /images/drone_takeuchi_Motion.mp4
    caption: This movie is a result of simulation about the behavior of multiple quadcopters. The black point shows the invader. Multiple quadcopters patrol around the task area. In addition, each quadcopter chases the invader that is detected by the omnidirectional-range sensor. The invader is chased alternately by quadcopters, cooperative motion is realized.
    jcaption: この動画は複数クアッドコプタの振る舞いのシミュレーション結果です．黒い点は不審者を示していおり，複数クアッドコプタは作業領域内を巡回し，加えて各機体は全方向センサで不審者を発見したら追跡します．不審者は代わる代わる機体により追跡されており，協調的な動きが実現された．
  - path: /images/drone_takeuchi_Imp.mp4
    caption: |-
      This movie is a result of simulation about the importance map on coverage control. This map shows the degree of observation. 
      Hot color is an area that is observation insufficient. Cold color is an area that is observation sufficient. Each quadcopter determines motion depending on this map, they move toward the high importance area. In addition, when the invader is detected, high importance map is given to the position of the invader, then a quadcopter that detected the invader chases it. Therefore, an autonomous patrol is realized by multiple quadcopters based on the importance map.
    jcaption: この動画は被覆制御における重要度マップのシミュレーション結果です．このマップは観測の程度を示しており，赤い色は観測が不十分な領域，青い色は観測が十分な領域を示している．各機体はこのマップに応じて動きを決定しており，重要度が高い領域へ向かって各クアッドコプタは移動する．さらに，不審者が検出されたとき，高い重要度マップが不審者の位置に与えられることで，不審者を検出したクアッドコプタは不審者を追跡する．したがって，重要度マップに基づいた複数クアッドコプタによる自律的な巡回が実現される．
