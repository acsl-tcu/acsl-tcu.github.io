title: Autonomous Patrol and Invader Detection by Coverage Controlled Quadcopters
jtitle: 被覆制御によるクアッドコプタの自律巡回と不審者検出
abst: This paper presents dynamic coverage control using multiple quadcopters for a surveillance of buildings or facilities. The surveillance system requires to move in the task area, detect and follow an invader. For observing an unknown invader, a fixed flight route cannot be chosen. In this paper, an autonomous surveillance method is proposed to detect an unknown invader considering the feature of the mounted sensor on a quadcopter. At the same time, a quadcopter follows an invader while patrolling in the task area. In order to verify the validity of the proposed method, the simulation is performed, and then the result of the simulation shows the effectiveness.
jabst: 本研究ではビルや施設の監視のために，複数クアッドコプタを用いた動的な被覆制御を提案する．監視システムは作業領域内を移動することと不審者を検出し追跡することが求められる．未知の不審者の観測のためには，固定された飛行ルートは選択されることはできない．この論文では，自律的な監視手法として，クアッドコプタに搭載されたセンサの特徴を考慮した未知不審者の検出を提案する．同時に作業領域内を巡回しながら不審者をクアッドコプタは追跡する．提案手法の動作を検証するためシミュレーションをし，その結果から有効性を示す．
keywords:
