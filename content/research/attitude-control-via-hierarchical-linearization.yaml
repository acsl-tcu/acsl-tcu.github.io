title: Attitude control via hierarchical linearization
jtitle: 階層型線形化を用いた姿勢制御
abst: In this research, we have proposed an attitude control law for underactuated two-wheel spacecraft under non-zero total angular momentum.  We propose to apply the hierarchical linearization which separates a system into two subsystems and linearizes the subsystems in step by step. Using this method, the partial linearization becomes possible because geometric nature of the system is changed. Moreover, the dimension of linearizable state increases relative to ordinary input-output linearization. The animation shows that the proposed controller achieves the desired attitude.
jabst: 本研究ではシステムを我々が開発した階層的に分解しながら線形化していく階層型線形化という新しい手法を２ホイールの衛星システムへ適用することで，目標姿勢への収束を実現した．
keywords:
  - Spacecraft
  - Hierarchical linearization
