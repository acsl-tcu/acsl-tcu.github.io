title: Driving Over Steps for Leg / Wheel Mobile Robots based on Model Predictive Control
jtitle: モデル予測制御を用いた立体型脚車輪移動ロボットの段差乗り越え
abst: |
   In this paper, we present a control method of locomotion to drive over steps to expand the range of activity for Leg / wheel mobile robots. Model predictive control incorporates the magnitude of the vertical load for each wheel to suppress overturn. 
jabst: 本研究では脚車輪移動ロボットを対象とし，モデル予測制御による段差の乗り越えを目的とした，姿勢制御手法を提案する．提案手法ではモデル予測制御に各脚の荷重の評価を組み込むことで転倒を抑制する
keywords:
  - Leg-Wheel
