    caption: |
      Comparison of the proposed method evaluating the load (left fig.) and the comparative method not evaluating (right fig.) when getting over the step.
      In the proposed method, the load of the leg above the step is suppressed.
    jcaption: |-
      段差乗り越え時、荷重を評価した提案手法(左図)と評価を行っていない比較手法(右図)の比較。
      提案手法では段差上の脚にかかる荷重が抑えている。
