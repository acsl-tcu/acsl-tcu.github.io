    caption: Marker association with optimization utilizing artificial potential field. Red points show true value and green points show estimated value. The predicted value converges on the nearest observation along the slope of the artificial potential field by optimization. Also, The occluded marker stay on the initial position.
    jcaption: 人工ポテンシャル場を用いた最適化計算によるマーカー対応付け．赤い丸が真値，緑の点が推定値を示す．最適化計算において，初期推定解は人工ポテンシャル場の傾きにより測定値付近に収束をする．また，オクルージョンが起きたマーカーは勾配が0に近いため初期値に停留する．
