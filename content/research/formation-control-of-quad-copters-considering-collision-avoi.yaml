title: Formation control of quad-copters considering collision avoidance using model predictive control in three dimensional space
jtitle: モデル予測制御による衝突回避を考慮したクアッドコプターの3次元フォーメーション制御
abst: This paper proposes a formation control for multi quad-copters considering collision avoidance using model predictive control (MPC) in three dimensional space. To achieve the formation control, decentralized multi-agent control (MAC) is utilized. Collision avoidance between control objects is considered by adding the term of repulsive force to index function of MPC. Thus this paper achieves formation control by combining MAC with MPC. In general, the repulsive force is described as a nonlinear function, but it's not appropriate to implement to practical system. Thus the term of repulsive force is approximated as a second order polynomial function in consideration of the extension to the experiment. Finally, the validity of proposed method is verified via numerical simulation using the linear model of quad-copter in three dimensional space.
jabst: 本研究では，モデル予測制御（MPC）により，衝突回避を考慮したクアッドコプターのフォーメーション制御を3次元空間で実現する．フォーメーション制御を達成するため，分散型のマルチエージェント制御（MAC）を用いる．制御対象間の衝突回避は，MPCの評価関数に斥力項を追加することにより考慮する．よって本研究では，MPCとMACを組み合わせることによってフォーメーション制御を達成する．一般に，斥力項は非線形関数として表されるが，実際のシステムに実装するには適さない．そのため，実機実験に拡張することを考慮し，斥力項を2次多項式に近似する．最後に，提案手法をクアッドコプターの線形3次元モデルに適用し，数値シミュレーションにより有効性を検証する．
