    caption: ""
    jcaption: 通路が広い場合の数値シミュレーション結果．赤い円は自律移動車両であり，黒い円は障害物を示す． また，青い円は障害物の不確かさに基づく予報円である． 予測された経路が青い破線で示され，障害物回避達成が確認できる．この場合では通路が広いため，減速するよりも大きく回避した方が良いことから障害物から離れて回避していることが確認できる．
