    jcaption: 通路が狭い場合の数値シミュレーション結果．赤い円は自律移動車両であり，黒い円は障害物を示す． また，青い円は障害物の不確かさに基づく予報円である． 予測された経路が青い破線で示され，障害物回避達成及び接近時に不確かさに基づいて自律移動車両の減速が行われていることが確認できる．
