    caption: Left figure and right figure depict the estimated trajectory with EKF and MHE, respectively. The red lines are the trajectory with each SLAM, the green lines are the trajectory with odometry, and the blue lines are the reference value measured by the motion capture system. The yellow area represents the section where the robot is surrounded by crowd and the part of measurement is occluded. As shown in right figure, MHE results in the estimation error smaller than EKF in the crowded environment.
    jcaption: 左図と右図は，それぞれEKFとMHEによる推定経路を示しています． 赤い線はSLAMによる推定経路，緑の線はオドメトリによる経路，青い線はモーションキャプチャで測定した参照経路を示している．黄色の領域は，ロボットが混雑環境において測定値が不足しているエリアを示している． 右図に示すように，混雑環境ではMHEの方がEKFより推定誤差が小さくなる．
