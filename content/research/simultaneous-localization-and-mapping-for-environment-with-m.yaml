figures:
  - path: /images/omni-directional_vehicle_tsuno3.mp4
    caption: |-
      A SLAM result with the proposed method. the blue line is the estimated trajectory, the orange points are constructed point cloud map, the black lines are the moving objects, and the orange sector is a scanning range of a sensor. 
      Map points with estimated velocities can track the moving objects.
    jcaption: 提案手法によるSLAM結果．青線は推定経路，橙点は構築した点群地図，黒線は移動物体，橙色の扇形はセンサの計測範囲を表している．各地図点の速度を推定する事で，点群地図は移動物体の位置を追従できている．
