# content ブランチ（Pages CMS の編集先）をチェックし、main への PR を自動作成する
name: Content check

on:
  push:
    branches: ["content"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Validate content
        run: node scripts/validate-content.mjs
      - name: Build
        run: npx --no-install next build

  open-pr:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Open PR content -> main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh pr list -R "$REPO" --head content --base main --state open --json number -q 'length')
          if [ "$n" = "0" ]; then
            gh pr create -R "$REPO" --head content --base main \
              --title "HP更新（content ブランチ）" \
              --body "Pages CMS からの更新です。差分を確認して問題なければマージしてください（マージで公開されます）。"
          fi
